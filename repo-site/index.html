<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KDotz Repo</title>
<link rel="icon" href="logo.png" type="image/png">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #3a1840 0%, #120818 55%, #0b0f1a 100%);
    color: #e8ecf5;
  }
  .card {
    max-width: 420px; margin: 24px; padding: 36px 32px; text-align: center;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px; backdrop-filter: blur(20px);
  }
  .logo {
    width: 112px; height: 112px; border-radius: 28px; object-fit: cover;
    margin: 0 auto 18px; display: block;
    box-shadow: 0 12px 32px rgba(255, 105, 180, 0.28);
    border: 2px solid rgba(255,182,220,0.35);
  }
  h1 { margin: 0 0 6px; font-size: 2rem; letter-spacing: -0.02em; }
  p.tag { margin: 0 0 24px; color: #c9a7c8; }
  .url {
    padding: 12px 16px; border-radius: 12px; background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.10); font-family: ui-monospace, Menlo, monospace;
    font-size: 0.85rem; word-break: break-all; user-select: all;
  }
  a.btn {
    display: inline-block; margin-top: 20px; padding: 12px 24px; border-radius: 14px;
    background: linear-gradient(135deg, #ff6bb5, #c45cff); color: #fff; text-decoration: none;
    font-weight: 600;
  }
  p.small { margin-top: 22px; font-size: 0.78rem; color: #7787a3; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="logo.png" width="112" height="112" alt="KDotz Repo">
    <h1>KDotz Repo</h1>
    <p class="tag">Tweaks by Kolby &mdash; rootless &amp; roothide</p>
    <div class="url" id="repo-url">loading&hellip;</div>
    <a class="btn" id="sileo-link" href="#">Add to Sileo</a>
    <p class="small">Same source works on rootless (Dopamine) and roothide (Relaxin&rsquo;) &mdash; Sileo picks the right build automatically.</p>
  </div>
  <script>
    const base = window.location.origin + window.location.pathname.replace(/index\.html$/, "");
    document.getElementById("repo-url").textContent = base;
    document.getElementById("sileo-link").href = "sileo://source/" + base;
  </script>
</body>
</html>
