name: Build RHCompat

on:
  workflow_dispatch:
  push:
    paths:
      - 'RHCompat/**'
      - '.github/workflows/build-rhcompat.yml'
  pull_request:
    paths:
      - 'RHCompat/**'
      - '.github/workflows/build-rhcompat.yml'

jobs:
  build-roothide:
    name: Build roothide .deb
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          brew install ldid dpkg make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup Theos (roothide fork)
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'
          libgcuniversal: 'false'
          altlist: 'false'

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun -sdk iphoneos --show-sdk-version

      - name: Build RHCompat (roothide only)
        working-directory: RHCompat
        env:
          THEOS: ${{ env.THEOS }}
        run: |
          set -euo pipefail
          SDK_VER="$(ls "$THEOS/sdks" | sed -n 's/iPhoneOS\([0-9.]*\)\.sdk/\1/p' | sort -V | tail -1 || true)"
          if [ -n "${SDK_VER:-}" ]; then
            sed -i '' "s/^TARGET :=.*/TARGET := iphone:clang:${SDK_VER}:15.0/" Makefile
            echo "Using SDK $SDK_VER"
          fi
          # Enforce arm64e arch tag for roothide packages
          sed -i '' 's/^Architecture: .*/Architecture: iphoneos-arm64e/' control
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          echo "Built packages:"
          ls -lah packages || ls -lah ../packages || true
          mkdir -p "$GITHUB_WORKSPACE/out"
          find . .. -name '*.deb' -path '*/packages/*' -print -exec cp {} "$GITHUB_WORKSPACE/out/" \;
          ls -lah "$GITHUB_WORKSPACE/out"

          DEB="$(ls "$GITHUB_WORKSPACE/out"/*.deb | head -1)"
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB" | head -40

          # Sanity: layout must be jbroot-relative, not /var/jb
          if dpkg-deb -c "$DEB" | grep -q ' var/jb/'; then
            echo "ERROR: roothide deb still contains /var/jb paths" >&2
            exit 1
          fi

          TMP=$(mktemp -d)
          dpkg-deb -x "$DEB" "$TMP"
          # Early-load dylib name
          test -f "$TMP"/Library/MobileSubstrate/DynamicLibraries/000RHCompat.dylib \
            || test -f "$TMP"/usr/lib/TweakInject/000RHCompat.dylib
          FILTER="$(find "$TMP" -name '000RHCompat.plist' | head -1)"
          test -n "$FILTER"
          plutil -p "$FILTER"
          # Safety: Preferences-only — never SpringBoard/UIKit (1.0.1 black-screen)
          grep -q 'Preferences' <(plutil -p "$FILTER")
          if grep -q 'springboard\|SpringBoard\|UIKit' <(plutil -p "$FILTER"); then
            echo "ERROR: filter must not inject SpringBoard/UIKit" >&2
            exit 1
          fi
          test -f "$TMP/Library/PreferenceLoader/Preferences/RHCompat.plist"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: RHCompat-roothide-deb
          path: out/*.deb
          if-no-files-found: error
