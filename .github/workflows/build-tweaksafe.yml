name: Build TweakSafe

on:
  workflow_dispatch:
  push:
    paths:
      - 'TweakSafe/**'
      - '.github/workflows/build-tweaksafe.yml'
  pull_request:
    paths:
      - 'TweakSafe/**'
      - '.github/workflows/build-tweaksafe.yml'

jobs:
  build-roothide:
    name: Build roothide .deb
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          brew install ldid dpkg make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup Theos (roothide fork)
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'
          libgcuniversal: 'false'
          altlist: 'false'

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build TweakSafe (roothide only)
        working-directory: TweakSafe
        env:
          THEOS: ${{ env.THEOS }}
        run: |
          set -euo pipefail
          SDK_VER="$(ls "$THEOS/sdks" | sed -n 's/iPhoneOS\([0-9.]*\)\.sdk/\1/p' | sort -V | tail -1 || true)"
          if [ -n "${SDK_VER:-}" ]; then
            sed -i '' "s/^TARGET :=.*/TARGET := iphone:clang:${SDK_VER}:15.0/" Makefile
            sed -i '' "s/^TARGET :=.*/TARGET := iphone:clang:${SDK_VER}:15.0/" prefs/Makefile
            echo "Using SDK $SDK_VER"
          fi
          sed -i '' 's/^Architecture: .*/Architecture: iphoneos-arm64e/' control
          chmod +x layout/DEBIAN/postinst
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          mkdir -p "$GITHUB_WORKSPACE/out"
          find . .. -name '*.deb' -path '*/packages/*' -print -exec cp {} "$GITHUB_WORKSPACE/out/" \;
          ls -lah "$GITHUB_WORKSPACE/out"

          DEB="$(ls "$GITHUB_WORKSPACE/out"/*.deb | head -1)"
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB"

          if dpkg-deb -c "$DEB" | grep -q ' var/jb/'; then
            echo "ERROR: roothide deb still contains /var/jb paths" >&2
            exit 1
          fi

          # Must NOT ship a Substrate tweak / RHCompat dylib
          if dpkg-deb -c "$DEB" | grep -qiE '000RHCompat|DynamicLibraries/.*\.dylib|TweakInject/.*\.dylib'; then
            echo "ERROR: TweakSafe must be prefs-only (no tweak dylibs)" >&2
            exit 1
          fi

          TMP=$(mktemp -d)
          dpkg-deb -x "$DEB" "$TMP"
          test -d "$TMP/Library/PreferenceBundles/TweakSafePrefs.bundle"
          test -f "$TMP/Library/PreferenceLoader/Preferences/TweakSafe.plist"
          # control must replace RHCompat
          dpkg-deb -f "$DEB" Replaces | grep -q 'com.kolby.rhcompat'
          dpkg-deb -f "$DEB" Conflicts | grep -q 'com.kolby.rhcompat'

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: TweakSafe-roothide-deb
          path: out/*.deb
          if-no-files-found: error
