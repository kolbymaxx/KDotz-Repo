name: Deploy KDotz Repo to Pages

on:
  push:
    branches: [main]
    paths:
      - 'Packages'
      - 'Packages.gz'
      - 'Packages.bz2'
      - 'Packages.xz'
      - 'Release'
      - 'dist/**'
      - 'repo-site/**'
      - 'CydiaIcon.png'
      - 'CydiaIcon@2x.png'
      - 'CydiaIcon@3x.png'
      - '.nojekyll'
      - '.github/workflows/deploy-repo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble repo site
        run: |
          set -euo pipefail
          mkdir -p site/dist
          cp Packages Packages.gz Packages.bz2 Packages.xz Release site/
          cp dist/*.deb site/dist/
          cp repo-site/index.html site/ 2>/dev/null || true
          cp repo-site/logo.png site/ 2>/dev/null || true
          cp CydiaIcon.png "CydiaIcon@2x.png" "CydiaIcon@3x.png" site/ 2>/dev/null || true
          # Prevent Jekyll from stripping extensionless APT files like Release
          touch site/.nojekyll
          test -f site/Release
          test -f site/Packages
          test -f site/Packages.gz
          test -f site/Packages.bz2
          test -f site/Packages.xz
          ls -laR site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
