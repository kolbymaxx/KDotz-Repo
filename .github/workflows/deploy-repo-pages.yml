name: Deploy KDotz Repo to Pages

on:
  push:
    branches: [main]
    paths:
      - 'Packages'
      - 'Packages.gz'
      - 'Release'
      - 'dist/**'
      - 'repo-site/**'
      - '.github/workflows/deploy-repo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble repo site
        run: |
          set -euo pipefail
          mkdir -p site/dist
          cp Packages Packages.gz Release site/
          cp dist/*.deb site/dist/
          cp repo-site/index.html site/ 2>/dev/null || true
          ls -laR site

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
